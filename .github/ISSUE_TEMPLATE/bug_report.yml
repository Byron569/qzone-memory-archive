name: Bug report
description: 报告可复现的问题
title: "fix: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: 问题描述
      description: 清楚说明预期行为与实际行为。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    attributes:
      label: 版本与平台
      placeholder: 例如 v1.0.2 / Windows 11
    validations:
      required: true
  - type: textarea
    attributes:
      label: 日志、截图或补充信息
